[project]
name = "ehr-media-intelligence"
version = "0.1.0"
description = "Ingest messy EHR exports, normalize to HL7 FHIR R4, summarize with an LLM, and search semantically."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "fhir.resources>=8.0",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ehr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: loads the real sentence-transformer model (deselect with -m 'not slow')",
]
